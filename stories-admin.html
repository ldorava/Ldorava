<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة الستوريات | L'DORA Viva</title>
  <style>
    :root {
      --pink: #d6336c;
      --pink-dark: #b02255;
      --bg: #fdf2f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    .wrap { max-width: 1080px; margin: 0 auto; }
    .box {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 14px;
      border: 1px solid #fce7f3;
    }
    h1 { margin: 0 0 4px; font-size: 1.2rem; color: var(--pink); }
    .muted { font-size: 0.85rem; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 4px; color: #374151; }
    input, select, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 0.9rem;
      background: #fff;
      font-family: inherit;
    }
    textarea { min-height: 64px; resize: vertical; }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--pink);
      color: #fff;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .btn:hover { background: var(--pink-dark); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn.sec { background: #f3f4f6; color: var(--text); }
    .btn.sec:hover { background: #e5e7eb; }
    .btn.danger { background: #fee2e2; color: #b91c1c; }
    .btn.danger:hover { background: #fecaca; }
    .btn.sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }
    .slide-item {
      background: #fdf8fb;
      border: 1px solid #f5d0fe;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }
    .layout { display: grid; grid-template-columns: 1.3fr 0.9fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .phone {
      width: 100%;
      max-width: 300px;
      height: 450px;
      margin: 0 auto;
      border-radius: 22px;
      background: #111;
      position: relative;
      overflow: hidden;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
    }
    .phone img, .phone video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .phone-top, .phone-bot { position: relative; z-index: 2; padding: 12px; }
    .phone-top {
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent);
      font-weight: 700;
      font-size: 0.86rem;
    }
    .phone-bot {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.88), transparent);
      text-align: center;
    }
    .badge-pending {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      background: #fef3c7;
      color: #92400e;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      display: none;
      z-index: 99999;
      max-width: 90vw;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="row" style="justify-content: space-between;">
        <div>
          <h1>🎬 إضافة الستوريات بضغطة زر — L'DORA Viva</h1>
          <div class="muted">اختر المنتج ونوعه المحدد، أو ارفع صورة/فيديو من جهازك، وعند حذف ستوري أو شريحة يتم حذف ملفاتها غير المستخدمة من GitHub عند النشر.</div>
        </div>
        <div class="row">
          <button class="btn" id="addStoryBtn" type="button">+ ستوري جديد</button>
          <button class="btn" id="publishGithubBtn" type="button">🚀 نشر لـ GitHub</button>
          <button class="btn sec" id="downloadJsonBtn" type="button">⬇ تحميل stories.json</button>
        </div>
      </div>

      <div id="pendingInfo" class="badge-pending" style="display: none;"></div>

      <details open style="margin-top: 12px;">
        <summary style="cursor: pointer; font-weight: 700; font-size: 0.88rem; color: var(--pink);">⚙️ إعدادات GitHub</summary>
        <div class="grid-2" style="margin-top: 10px;">
          <div>
            <label>المستودع (Owner/Repo)</label>
            <input id="ghRepo" type="text" value="ldorava/Ldorava">
          </div>
          <div>
            <label>الفرع (Branch)</label>
            <input id="ghBranch" type="text" value="main">
          </div>
          <div>
            <label>مجلد حفظ الصور والفيديوهات</label>
            <input id="ghMediaDir" type="text" value="data/stories-media">
          </div>
          <div>
            <label>GitHub Personal Access Token</label>
            <input id="ghToken" type="password" placeholder="ghp_...">
          </div>
        </div>
      </details>
    </div>

    <div class="layout">
      <div id="storiesEditor"></div>

      <div class="box" style="position: sticky; top: 14px;">
        <div class="phone">
          <img id="prevImg" src="icon-512.png" alt="">
          <video id="prevVid" playsinline controls style="display: none;"></video>
          <div class="phone-top" id="prevTitle">معاينة</div>
          <div class="phone-bot">
            <div id="prevCaption" style="font-size: 0.84rem; line-height: 1.5; margin-bottom: 8px;"></div>
            <span id="prevCta" style="display: none; background: var(--pink); color: #fff; padding: 5px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;">🛒 أضيفي للسلة</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORIES_FILE_PATH = "data/stories.json";
    const STORE_FILE_PATH = "./data/store.json";
    const SEEN_STORAGE_KEY = "ldorava_seen_stories_v2";
    const PROTECTED_FILES = new Set(["icon-512.png", "favicon.ico"]);

    let stories = [];
    let products = [];
    let pendingUploads = {};
    let initialStoryMediaPaths = new Set();
    let activeStory = 0;
    let activeSlide = 0;

    const editorEl = document.getElementById("storiesEditor");
    const toastEl = document.getElementById("toast");
    const pendingInfoEl = document.getElementById("pendingInfo");
    const publishBtn = document.getElementById("publishGithubBtn");

    const ghRepoInput = document.getElementById("ghRepo");
    const ghBranchInput = document.getElementById("ghBranch");
    const ghMediaDirInput = document.getElementById("ghMediaDir");
    const ghTokenInput = document.getElementById("ghToken");

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { toastEl.style.display = "none"; }, 3000);
    }

    function updatePendingBadge() {
      const count = Object.keys(pendingUploads).length;
      if (count > 0) {
        pendingInfoEl.style.display = "inline-block";
        pendingInfoEl.textContent = `ملفات جاهزة للرفع إلى GitHub: ${count}`;
      } else {
        pendingInfoEl.style.display = "none";
      }
    }

    function loadGhPrefs() {
      ghRepoInput.value = localStorage.getItem("ld_gh_repo") || "ldorava/Ldorava";
      ghBranchInput.value = localStorage.getItem("ld_gh_branch") || "main";
      ghMediaDirInput.value = localStorage.getItem("ld_gh_dir") || "data/stories-media";
      ghTokenInput.value = localStorage.getItem("ld_gh_token") || "";
    }

    function saveGhPrefs() {
      localStorage.setItem("ld_gh_repo", ghRepoInput.value.trim());
      localStorage.setItem("ld_gh_branch", ghBranchInput.value.trim() || "main");
      localStorage.setItem("ld_gh_dir", ghMediaDirInput.value.trim().replace(/^\/+|\/+$/g, "") || "data/stories-media");
      localStorage.setItem("ld_gh_token", ghTokenInput.value.trim());
    }

    [ghRepoInput, ghBranchInput, ghMediaDirInput, ghTokenInput].forEach(el => {
      el.addEventListener("change", saveGhPrefs);
    });

    function extractRepoMediaPath(url, repoFullName = "", branch = "main") {
      if (!url || typeof url !== "string") return null;
      const clean = url.trim().split("?")[0].split("#")[0];
      if (!clean || clean.startsWith("data:") || clean.startsWith("blob:")) return null;

      if (!/^https?:\/\//i.test(clean)) {
        const rel = clean.replace(/^\.?\//, "").replace(/^\/+/, "");
        if (!rel || PROTECTED_FILES.has(rel)) return null;
        return rel;
      }

      const [owner = "", repo = ""] = String(repoFullName || "").split("/");
      try {
        const u = new URL(clean);
        const path = decodeURIComponent(u.pathname).replace(/^\/+/, "");
        if (u.hostname === "raw.githubusercontent.com" && owner && repo) {
          const prefix = `${owner}/${repo}/${branch}/`;
          if (path.startsWith(prefix)) {
            const p = path.slice(prefix.length);
            return PROTECTED_FILES.has(p) ? null : p;
          }
        }
        if (u.hostname.endsWith(".github.io") && repo) {
          const repoPrefix = `${repo}/`;
          if (path.startsWith(repoPrefix)) {
            const p = path.slice(repoPrefix.length);
            return PROTECTED_FILES.has(p) ? null : p;
          }
        }
      } catch {}

      return null;
    }

    function collectStoriesMediaPaths(storyList, repoFullName = "", branch = "main") {
      const set = new Set();
      const mediaDir = (ghMediaDirInput.value.trim() || "data/stories-media").replace(/^\/+|\/+$/g, "");
      const add = (val) => {
        const p = extractRepoMediaPath(val, repoFullName, branch);
        if (!p) return;
        // نحذف الملفات الموجودة في مجلد الستوريات أو المسارات المرفوعة للستوريات
        if (p.startsWith(mediaDir + "/") || p.startsWith("data/stories-media/")) {
          set.add(p);
        }
      };

      (storyList || []).forEach(st => {
        add(st?.cover);
        add(st?.image);
        (st?.slides || []).forEach(sl => {
          add(sl?.media);
          add(sl?.image);
          add(sl?.poster);
        });
      });

      return set;
    }

    async function deleteGithubFile(repo, branch, filePath, token) {
      const encodedPath = filePath.split("/").map(encodeURIComponent).join("/");
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${encodedPath}`;
      const headers = {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json"
      };

      const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, { headers });
      if (getRes.status === 404) return;
      if (!getRes.ok) {
        throw new Error(`تعذر فحص الملف ${filePath}`);
      }

      const meta = await getRes.json();
      if (!meta?.sha) return;

      const delRes = await fetch(apiUrl, {
        method: "DELETE",
        headers: {
          ...headers,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Delete unused story media ${filePath}`,
          sha: meta.sha,
          branch
        })
      });

      if (!delRes.ok && delRes.status !== 404) {
        throw new Error(`فشل حذف الملف ${filePath}`);
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const res = String(reader.result || "");
          const idx = res.indexOf(",");
          resolve({ base64: idx >= 0 ? res.slice(idx + 1) : res, dataUrl: res });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function captureVideoPosterBase64(videoDataUrl) {
      return new Promise((resolve) => {
        try {
          const v = document.createElement("video");
          v.muted = true;
          v.playsInline = true;
          v.src = videoDataUrl;
          v.addEventListener("loadeddata", () => {
            v.currentTime = 0.1;
          }, { once: true });
          v.addEventListener("seeked", () => {
            try {
              const canvas = document.createElement("canvas");
              canvas.width = v.videoWidth || 480;
              canvas.height = v.videoHeight || 640;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
              const jpgUrl = canvas.toDataURL("image/jpeg", 0.82);
              const idx = jpgUrl.indexOf(",");
              resolve({ base64: idx >= 0 ? jpgUrl.slice(idx + 1) : "", dataUrl: jpgUrl });
            } catch {
              resolve(null);
            }
          }, { once: true });
          v.addEventListener("error", () => resolve(null), { once: true });
        } catch {
          resolve(null);
        }
      });
    }

    async function handleFileUpload(file, onAssigned) {
      if (!file) return;
      saveGhPrefs();
      const dir = (ghMediaDirInput.value.trim() || "data/stories-media").replace(/^\/+|\/+$/g, "");
      const safeName = Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const repoPath = `${dir}/${safeName}`;

      const { base64, dataUrl } = await fileToBase64(file);
      const isVideo = file.type.startsWith("video/");
      pendingUploads[repoPath] = { base64, dataUrl, isVideo };

      let posterInfo = null;
      if (isVideo) {
        const snap = await captureVideoPosterBase64(dataUrl);
        if (snap && snap.base64) {
          const posterPath = `${dir}/poster-${Date.now()}.jpg`;
          pendingUploads[posterPath] = { base64: snap.base64, dataUrl: snap.dataUrl, isVideo: false };
          posterInfo = { repoPath: posterPath, dataUrl: snap.dataUrl };
        }
      }

      updatePendingBadge();
      onAssigned(repoPath, dataUrl, isVideo, posterInfo);
      toast("تم تجهيز الملف: " + safeName);
    }

    function extractProductImage(obj, fallback = "") {
      if (!obj || typeof obj !== "object") return fallback;
      const raw = obj.image || obj.img || obj.photo || obj.thumbnail || obj.cover ||
        (Array.isArray(obj.images) ? obj.images[0] : "") || fallback;
      return String(raw || "").trim();
    }

    function normalizeVariants(rawProduct, defaultImg) {
      const rawList =
        (Array.isArray(rawProduct.variants) && rawProduct.variants) ||
        (Array.isArray(rawProduct.options) && rawProduct.options) ||
        (Array.isArray(rawProduct.types) && rawProduct.types) ||
        (Array.isArray(rawProduct.items) && rawProduct.items) ||
        [];

      return rawList.map((v, idx) => {
        if (typeof v === "string") {
          return { id: v, name: v, image: defaultImg };
        }
        const vId = String(v.id ?? v.variant_id ?? v.sku ?? v.value ?? v.name ?? v.title ?? v.label ?? (idx + 1));
        const vName = String(v.name ?? v.title ?? v.label ?? v.variant ?? v.option ?? v.type ?? v.color ?? v.size ?? vId);
        return {
          id: vId,
          name: vName,
          image: extractProductImage(v, defaultImg)
        };
      });
    }

    async function loadStore() {
      try {
        const r = await fetch(STORE_FILE_PATH + "?v=" + Date.now());
        if (!r.ok) return;
        const d = await r.json();
        const arr = Array.isArray(d) ? d : (Array.isArray(d.products) ? d.products : []);
        products = arr.map((p, i) => {
          const baseImg = extractProductImage(p, "");
          return {
            id: String(p.id ?? p.product_id ?? i + 1),
            name: String(p.title ?? p.name ?? p.product_name ?? ("منتج #" + (i + 1))),
            image: baseImg,
            variants: normalizeVariants(p, baseImg)
          };
        });
      } catch {}
    }

    function getProductById(id) {
      return products.find(p => String(p.id) === String(id)) || null;
    }

    function getVariantById(prod, variantId) {
      if (!prod || !Array.isArray(prod.variants) || !variantId) return null;
      return prod.variants.find(v => String(v.id) === String(variantId)) || null;
    }

    function getSlideTargetImage(sl) {
      const prod = sl?.productId ? getProductById(sl.productId) : null;
      const variant = (prod && sl?.variantId) ? getVariantById(prod, sl.variantId) : null;
      return (variant && variant.image) || (prod && prod.image) || "";
    }

    function resolveStoryCover(st) {
      if (st._previewCover) return st._previewCover;
      if (st.cover && st.cover !== "icon-512.png" && st.cover.trim() !== "") return st.cover;
      const firstSlide = st.slides?.[0];
      if (firstSlide) {
        if (firstSlide._previewPoster) return firstSlide._previewPoster;
        if (firstSlide.poster) return firstSlide.poster;
        const targetImg = getSlideTargetImage(firstSlide);
        if (targetImg) return targetImg;
        if (firstSlide._previewUrl && firstSlide.type !== "video") return firstSlide._previewUrl;
        const m = firstSlide.media || firstSlide.image || "";
        if (m && !/\.(mp4|webm|mov)(\?.*)?$/i.test(m) && firstSlide.type !== "video") {
          return m;
        }
      }
      return st.cover || "icon-512.png";
    }

    async function loadStories() {
      try {
        const r = await fetch("./" + STORIES_FILE_PATH + "?v=" + Date.now());
        if (r.ok) {
          const d = await r.json();
          if (Array.isArray(d) && d.length) {
            stories = d;
            initialStoryMediaPaths = collectStoriesMediaPaths(
              stories,
              ghRepoInput.value.trim(),
              ghBranchInput.value.trim() || "main"
            );
            render();
            return;
          }
        }
      } catch {}

      stories = [{
        id: "offers-today",
        title: "عروض اليوم 🔥",
        cover: "",
        slides: [{ media: "icon-512.png", caption: "أحدث العروض والمنتجات من L'DORA Viva", productId: "", variantId: "", variantName: "" }]
      }];
      initialStoryMediaPaths = collectStoriesMediaPaths(
        stories,
        ghRepoInput.value.trim(),
        ghBranchInput.value.trim() || "main"
      );
      render();
    }

    function prodOptions(selId) {
      let html = `<option value="">-- بدون ربط بمنتج --</option>`;
      for (const p of products) {
        html += `<option value="${esc(p.id)}" ${String(p.id) === String(selId) ? "selected" : ""}>${esc(p.name)}</option>`;
      }
      return html;
    }

    function variantOptions(prod, selVariantId) {
      if (!prod || !Array.isArray(prod.variants) || !prod.variants.length) {
        return `<option value="">-- لا توجد أنواع لهذا المنتج --</option>`;
      }
      let html = `<option value="">-- اختر النوع --</option>`;
      for (const v of prod.variants) {
        html += `<option value="${esc(v.id)}" ${String(v.id) === String(selVariantId) ? "selected" : ""}>${esc(v.name)}</option>`;
      }
      return html;
    }

    function esc(s) {
      return String(s ?? "").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    window.onProductSelect = (sIdx, slIdx, prodId) => {
      const sl = stories[sIdx].slides[slIdx];
      sl.productId = prodId;
      sl.variantId = "";
      sl.variantName = "";

      const prod = getProductById(prodId);
      if (prod && prod.image) {
        const currentMedia = sl.media || sl.image || "";
        if (!currentMedia || currentMedia === "icon-512.png" || sl._autoFromProduct) {
          sl.media = prod.image;
          sl.type = "image";
          sl._autoFromProduct = true;
        }
        if (!stories[sIdx].cover || stories[sIdx].cover === "icon-512.png") {
          stories[sIdx].cover = prod.image;
        }
      }
      activeStory = sIdx;
      activeSlide = slIdx;
      render();
    };

    window.onVariantSelect = (sIdx, slIdx, variantId) => {
      const sl = stories[sIdx].slides[slIdx];
      const prod = getProductById(sl.productId);
      const variant = getVariantById(prod, variantId);

      sl.variantId = variantId;
      sl.variantName = variant ? variant.name : "";

      const img = (variant && variant.image) || (prod && prod.image) || "";
      if (img) {
        const currentMedia = sl.media || sl.image || "";
        if (!currentMedia || currentMedia === "icon-512.png" || sl._autoFromProduct) {
          sl.media = img;
          sl.type = "image";
          sl._autoFromProduct = true;
        }
        if (!stories[sIdx].cover || stories[sIdx].cover === "icon-512.png") {
          stories[sIdx].cover = img;
        }
      }

      activeStory = sIdx;
      activeSlide = slIdx;
      render();
    };

    function render() {
      editorEl.innerHTML = stories.map((st, sIdx) => {
        const autoCover = resolveStoryCover(st);
        return `
          <div class="box">
            <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
              <div class="row">
                <img src="${esc(autoCover)}" alt="" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink);">
                <strong>${esc(st.title || ("ستوري " + (sIdx + 1)))}</strong>
              </div>
              <div class="row">
                <button class="btn sec sm" type="button" onclick="resetSingleStory(${sIdx})" title="إعادة ضبط عداد 42 ساعة لهذا الستوري فقط">🔄 إعادة الستوري</button>
                <button class="btn sec sm" type="button" onclick="addSlide(${sIdx})">+ شريحة</button>
                <button class="btn danger sm" type="button" onclick="delStory(${sIdx})">حذف</button>
              </div>
            </div>

            <div class="grid-2">
              <div>
                <label>عنوان الستوري</label>
                <input type="text" value="${esc(st.title)}" oninput="stories[${sIdx}].title=this.value; activeStory=${sIdx}; updatePreview();">
              </div>
              <div>
                <label>غلاف تلقائي من المنشور/الفيديو (أو اختر صورة غلاف مخصصة)</label>
                <div class="row">
                  <input type="text" style="flex: 1;" placeholder="تلقائي من صورة المنشور أو الفيديو" value="${esc(st.cover)}" oninput="stories[${sIdx}].cover=this.value; render();">
                  <input type="file" accept="image/*" style="width: auto; padding: 5px;" onchange="onCoverPick(event, ${sIdx})">
                </div>
              </div>
            </div>

            ${(st.slides || []).map((sl, slIdx) => {
              const mediaVal = sl.media || sl.image || "";
              const prod = sl.productId ? getProductById(sl.productId) : null;
              const hasVariants = Boolean(prod && Array.isArray(prod.variants) && prod.variants.length);
              return `
                <div class="slide-item">
                  <div class="row" style="justify-content: space-between; margin-bottom: 6px;">
                    <strong style="color: var(--pink); font-size: 0.85rem;">شريحة ${slIdx + 1}</strong>
                    <div class="row">
                      <button class="btn sec sm" type="button" onclick="activeStory=${sIdx}; activeSlide=${slIdx}; updatePreview();">معاينة</button>
                      ${st.slides.length > 1 ? `<button class="btn danger sm" type="button" onclick="delSlide(${sIdx},${slIdx})">إزالة</button>` : ""}
                    </div>
                  </div>
                  <div class="grid-2">
                    <div>
                      <label>ربط بمنتج/منشور</label>
                      <select onchange="onProductSelect(${sIdx}, ${slIdx}, this.value)">
                        ${prodOptions(sl.productId)}
                      </select>
                    </div>
                    <div>
                      <label>نوع المنتج (Variant)</label>
                      <select ${hasVariants ? "" : "disabled"} onchange="onVariantSelect(${sIdx}, ${slIdx}, this.value)">
                        ${variantOptions(prod, sl.variantId)}
                      </select>
                    </div>
                  </div>
                  <div style="margin-top: 8px;">
                    <label>أو ارفع صورة / فيديو من جهازك</label>
                    <div class="row">
                      <input type="text" style="flex: 1;" value="${esc(mediaVal)}" oninput="stories[${sIdx}].slides[${slIdx}]._autoFromProduct=false; stories[${sIdx}].slides[${slIdx}].media=this.value; activeStory=${sIdx}; activeSlide=${slIdx}; updatePreview();">
                      <input type="file" accept="image/*,video/mp4,video/webm" style="width: auto; padding: 5px;" onchange="onSlideMediaPick(event, ${sIdx}, ${slIdx})">
                    </div>
                  </div>
                  <div style="margin-top: 8px;">
                    <label>النص الظاهر على الشريحة</label>
                    <textarea oninput="stories[${sIdx}].slides[${slIdx}].caption=this.value; activeStory=${sIdx}; activeSlide=${slIdx}; updatePreview();">${esc(sl.caption)}</textarea>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }).join("");

      updatePreview();
    }

    window.resetSingleStory = (sIdx) => {
      const st = stories[sIdx];
      const storyId = String(st?.id || "").trim();
      if (!storyId) {
        toast("هذا الستوري لا يملك معرف ID");
        return;
      }
      try {
        const raw = localStorage.getItem(SEEN_STORAGE_KEY);
        const map = raw ? JSON.parse(raw) : {};
        if (map && typeof map === "object" && !Array.isArray(map)) {
          delete map[storyId];
          localStorage.setItem(SEEN_STORAGE_KEY, JSON.stringify(map));
        }
        toast(`تمت إعادة ضبط الستوري: ${st.title || storyId} ✅`);
      } catch {
        toast("تعذر إعادة الضبط على هذا المتصفح");
      }
    };

    window.onCoverPick = async (e, sIdx) => {
      const f = e.target.files?.[0];
      await handleFileUpload(f, (repoPath, dataUrl) => {
        stories[sIdx].cover = repoPath;
        stories[sIdx]._previewCover = dataUrl;
        render();
      });
    };

    window.onSlideMediaPick = async (e, sIdx, slIdx) => {
      const f = e.target.files?.[0];
      await handleFileUpload(f, (repoPath, dataUrl, isVideo, posterInfo) => {
        const sl = stories[sIdx].slides[slIdx];
        sl._autoFromProduct = false;
        sl.media = repoPath;
        sl.type = isVideo ? "video" : "image";
        sl._previewUrl = dataUrl;

        if (isVideo && posterInfo) {
          sl.poster = posterInfo.repoPath;
          sl._previewPoster = posterInfo.dataUrl;
        }

        if (!stories[sIdx].cover || stories[sIdx].cover === "icon-512.png") {
          if (!isVideo) {
            stories[sIdx].cover = repoPath;
            stories[sIdx]._previewCover = dataUrl;
          } else if (posterInfo) {
            stories[sIdx].cover = posterInfo.repoPath;
            stories[sIdx]._previewCover = posterInfo.dataUrl;
          }
        }

        activeStory = sIdx;
        activeSlide = slIdx;
        render();
      });
    };

    window.addSlide = (sIdx) => {
      stories[sIdx].slides.push({ media: "", caption: "", productId: "", variantId: "", variantName: "" });
      activeStory = sIdx;
      activeSlide = stories[sIdx].slides.length - 1;
      render();
    };

    window.delSlide = (sIdx, slIdx) => {
      stories[sIdx].slides.splice(slIdx, 1);
      activeSlide = 0;
      render();
    };

    window.delStory = (sIdx) => {
      stories.splice(sIdx, 1);
      activeStory = 0;
      activeSlide = 0;
      render();
    };

    function getCleanStoriesJson() {
      return JSON.stringify(stories.map((st, idx) => {
        const autoCover = resolveStoryCover(st);
        const cleanCover = (autoCover && !autoCover.startsWith("data:"))
          ? autoCover
          : (st.cover && !st.cover.startsWith("data:") ? st.cover : "icon-512.png");

        return {
          id: String(st.id || ("story-" + (idx + 1))).trim(),
          title: String(st.title || "").trim(),
          cover: String(cleanCover).trim(),
          slides: (st.slides || []).map(sl => {
            const prod = sl.productId ? getProductById(sl.productId) : null;
            const variant = (prod && sl.variantId) ? getVariantById(prod, sl.variantId) : null;
            const targetImg = getSlideTargetImage(sl);
            const m = String(sl.media || sl.image || targetImg || cleanCover || "icon-512.png").trim();
            const item = {
              media: m,
              caption: String(sl.caption || "").trim(),
              productId: String(sl.productId || "").trim(),
              variantId: String(sl.variantId || "").trim(),
              variantName: String((variant && variant.name) || sl.variantName || "").trim()
            };
            if (sl.poster && !String(sl.poster).startsWith("data:")) {
              item.poster = String(sl.poster).trim();
            }
            if (sl.type === "video" || /\.(mp4|webm|mov)$/i.test(m)) item.type = "video";
            return item;
          })
        };
      }), null, 2);
    }

    function updatePreview() {
      const st = stories[activeStory];
      const sl = st?.slides?.[activeSlide];
      const imgEl = document.getElementById("prevImg");
      const vidEl = document.getElementById("prevVid");
      const ctaEl = document.getElementById("prevCta");

      document.getElementById("prevTitle").textContent = st?.title || "";
      document.getElementById("prevCaption").textContent = sl?.caption || "";

      if (sl?.productId) {
        const prod = getProductById(sl.productId);
        const variant = (prod && sl.variantId) ? getVariantById(prod, sl.variantId) : null;
        const vLabel = (variant && variant.name) || sl.variantName || "";
        ctaEl.style.display = "inline-block";
        ctaEl.textContent = vLabel ? `🛒 أضيفي للسلة (${vLabel})` : "🛒 أضيفي للسلة";
      } else {
        ctaEl.style.display = "none";
      }

      const targetImg = getSlideTargetImage(sl);
      const src = sl?._previewUrl || sl?.media || sl?.image || targetImg || resolveStoryCover(st) || "icon-512.png";
      const isVid = Boolean(sl?._previewUrl && sl.type === "video") || /\.(mp4|webm|mov)(\?.*)?$/i.test(src);

      if (isVid) {
        imgEl.style.display = "none";
        vidEl.style.display = "block";
        vidEl.src = src;
      } else {
        vidEl.pause();
        vidEl.style.display = "none";
        imgEl.style.display = "block";
        imgEl.src = src;
      }
    }

    async function putGithubFile(repo, branch, path, base64Content, message, token) {
      const apiBase = `https://api.github.com/repos/${repo}/contents/${path}`;
      const headers = {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json",
        "Accept": "application/vnd.github+json"
      };

      let sha = undefined;
      const checkRes = await fetch(`${apiBase}?ref=${encodeURIComponent(branch)}`, { headers });
      if (checkRes.ok) {
        const existing = await checkRes.json();
        sha = existing.sha;
      }

      const body = { message, content: base64Content, branch };
      if (sha) body.sha = sha;

      const putRes = await fetch(apiBase, { method: "PUT", headers, body: JSON.stringify(body) });
      if (!putRes.ok) {
        const err = await putRes.text();
        throw new Error(`فشل رفع ${path}: ${err.slice(0, 140)}`);
      }
    }

    publishBtn.onclick = async () => {
      saveGhPrefs();
      const repo = ghRepoInput.value.trim();
      const branch = ghBranchInput.value.trim() || "main";
      const token = ghTokenInput.value.trim();

      if (!repo || !token) {
        toast("أدخل المستودع و GitHub Token أولاً");
        return;
      }

      publishBtn.disabled = true;
      try {
        toast("جاري رفع الملفات وتحديث stories.json...");
        for (const [filePath, info] of Object.entries(pendingUploads)) {
          await putGithubFile(repo, branch, filePath, info.base64, `Add story media ${filePath}`, token);
        }
        pendingUploads = {};
        updatePendingBadge();

        const jsonStr = getCleanStoriesJson();
        const jsonBase64 = btoa(unescape(encodeURIComponent(jsonStr)));
        await putGithubFile(repo, branch, STORIES_FILE_PATH, jsonBase64, "Update data/stories.json", token);

        const currentUsed = collectStoriesMediaPaths(stories, repo, branch);
        const filesToDelete = [...initialStoryMediaPaths].filter(p => !currentUsed.has(p));

        for (const filePath of filesToDelete) {
          try {
            await deleteGithubFile(repo, branch, filePath, token);
          } catch (delErr) {
            console.error(delErr);
          }
        }

        initialStoryMediaPaths = currentUsed;
        toast(
          filesToDelete.length
            ? `تم النشر وحذف ${filesToDelete.length} ملف غير مستخدم ✅`
            : "تم النشر إلى GitHub بنجاح ✅"
        );
      } catch (e) {
        toast(e.message || "حدث خطأ أثناء النشر");
      } finally {
        publishBtn.disabled = false;
      }
    };

    document.getElementById("downloadJsonBtn").onclick = () => {
      const blob = new Blob([getCleanStoriesJson()], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "stories.json";
      a.click();
      URL.revokeObjectURL(url);
      toast("تم تحميل stories.json");
    };

    document.getElementById("addStoryBtn").onclick = () => {
      stories.push({
        id: "story-" + Date.now(),
        title: "ستوري جديد",
        cover: "",
        slides: [{ media: "", caption: "", productId: "", variantId: "", variantName: "" }]
      });
      activeStory = stories.length - 1;
      activeSlide = 0;
      render();
    };

    (async () => {
      loadGhPrefs();
      await loadStore();
      await loadStories();
      updatePendingBadge();
    })();
  </script>
</body>
</html>
