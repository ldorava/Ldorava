<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة الستوريات | L'DORA Viva</title>
  <style>
    :root {
      --pink: #d6336c;
      --pink-dark: #b02255;
      --bg: #fdf2f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #f3e8ff;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 1120px; margin: 0 auto; }
    header {
      background: var(--card);
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 1.25rem; color: var(--pink); }
    .sub { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button, select, input, textarea {
      font-family: inherit;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--pink);
      color: #fff;
      transition: 0.15s;
    }
    .btn:hover { background: var(--pink-dark); }
    .btn.sec { background: #f3f4f6; color: var(--text); }
    .btn.sec:hover { background: #e5e7eb; }
    .btn.danger { background: #fee2e2; color: #b91c1c; }
    .btn.danger:hover { background: #fecaca; }
    .btn.sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }

    .layout {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .story-box {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      margin-bottom: 16px;
      border: 1px solid #fce7f3;
    }
    .story-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f3f4f6;
      margin-bottom: 14px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 4px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 0.9rem;
      background: #fff;
    }
    textarea { min-height: 68px; resize: vertical; }

    .slides-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .slide-card {
      background: #fdf8fb;
      border: 1px solid #f5d0fe;
      border-radius: 12px;
      padding: 12px;
    }
    .slide-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--pink);
    }

    /* معاينة إنستغرام */
    .preview-panel {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 16px;
    }
    .mini-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid #f3f4f6;
    }
    .mini-story {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 60px;
      flex-shrink: 0;
      cursor: pointer;
      font-size: 0.72rem;
      text-align: center;
    }
    .mini-ring {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #f59e0b, #d6336c, #9333ea);
    }
    .mini-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      background: #fff;
    }
    .phone-frame {
      width: 100%;
      max-width: 310px;
      height: 460px;
      margin: 0 auto;
      border-radius: 22px;
      background: #111;
      position: relative;
      overflow: hidden;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }
    .phone-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .phone-top, .phone-bottom {
      position: relative;
      z-index: 2;
      padding: 12px;
    }
    .phone-top {
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .phone-bottom {
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      text-align: center;
    }
    .phone-caption { font-size: 0.85rem; line-height: 1.5; margin-bottom: 8px; }
    .phone-cta {
      display: inline-block;
      background: var(--pink);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .json-box {
      margin-top: 16px;
      background: #111827;
      color: #f9fafb;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.75rem;
      direction: ltr;
      text-align: left;
      max-height: 220px;
      overflow: auto;
      white-space: pre;
    }
    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      z-index: 99999;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>📸 لوحة إضافة وإدارة الستوريات — L'DORA Viva</h1>
        <div class="sub">أضف الستوريات والشرائح، عاين شكلها مباشرة، ثم انسخ أو حمّل <code>data/stories.json</code> لرفعه إلى GitHub.</div>
      </div>
      <div class="actions">
        <button class="btn" id="addStoryBtn" type="button">+ ستوري جديد</button>
        <button class="btn sec" id="loadExistingBtn" type="button">↻ تحميل الحالي</button>
        <button class="btn sec" id="copyJsonBtn" type="button">📋 نسخ JSON</button>
        <button class="btn" id="downloadJsonBtn" type="button">⬇ تحميل stories.json</button>
      </div>
    </header>

    <div class="layout">
      <div id="editorColumn"></div>

      <aside class="preview-panel">
        <div class="mini-bar" id="miniBar"></div>
        <div class="phone-frame">
          <img class="phone-bg" id="prevImg" src="icon-512.png" alt="">
          <div class="phone-top" id="prevTitle">معاينة الستوري</div>
          <div class="phone-bottom">
            <div class="phone-caption" id="prevCaption">اختر أو أضف شريحة للمعاينة</div>
            <span class="phone-cta" id="prevCta" style="display:none;">🛒 أضيفي للسلة</span>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:8px;margin-top:10px;">
          <button class="btn sec sm" id="prevSlideBtn" type="button">السابقة</button>
          <span id="slideCounter" style="font-size:0.82rem;line-height:28px;color:var(--muted);">0 / 0</span>
          <button class="btn sec sm" id="nextSlideBtn" type="button">التالية</button>
        </div>

        <div class="json-box" id="jsonPreview"></div>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORIES_PATH = "./data/stories.json";
    const STORE_PATH = "./data/store.json";

    let stories = [];
    let storeProducts = [];
    let activeStoryIdx = 0;
    let activeSlideIdx = 0;

    const editorCol = document.getElementById("editorColumn");
    const miniBar = document.getElementById("miniBar");
    const jsonPreview = document.getElementById("jsonPreview");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toastEl.style.display = "none"; }, 2400);
    }

    function slugifyId(val) {
      return String(val || "story")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^\w\u0600-\u06ff-]/g, "") || ("story-" + Date.now());
    }

    async function loadStoreProducts() {
      try {
        const res = await fetch(STORE_PATH + "?v=" + Date.now());
        if (!res.ok) return;
        const data = await res.json();
        const list = Array.isArray(data) ? data : (Array.isArray(data.products) ? data.products : []);
        storeProducts = list.map((p, i) => ({
          id: String(p.id ?? p.product_id ?? i + 1),
          name: String(p.title ?? p.name ?? p.product_name ?? ("منتج #" + (i + 1)))
        }));
      } catch {}
    }

    async function loadStories() {
      try {
        const res = await fetch(STORIES_PATH + "?v=" + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length) {
            stories = data;
            activeStoryIdx = 0;
            activeSlideIdx = 0;
            renderAll();
            showToast("تم تحميل الستوريات الحالية");
            return;
          }
        }
      } catch {}

      stories = [{
        id: "offers-today",
        title: "عروض اليوم 🔥",
        cover: "icon-512.png",
        slides: [{
          image: "icon-512.png",
          caption: "اكتشفي أحدث عروض وباقات L'DORA Viva الآن!",
          productId: ""
        }]
      }];
      renderAll();
    }

    function renderProductOptions(selectedId) {
      const opts = [`<option value="">-- بدون زر إضافة للسلة --</option>`];
      for (const p of storeProducts) {
        const sel = String(p.id) === String(selectedId) ? "selected" : "";
        opts.push(`<option value="${p.id}" ${sel}>${p.name} (${p.id})</option>`);
      }
      if (selectedId && !storeProducts.some(p => String(p.id) === String(selectedId))) {
        opts.push(`<option value="${selectedId}" selected>معرف مخصص: ${selectedId}</option>`);
      }
      return opts.join("");
    }

    function renderEditor() {
      if (!stories.length) {
        editorCol.innerHTML = `<div class="story-box">لا توجد ستوريات بعد. اضغط على <b>+ ستوري جديد</b>.</div>`;
        return;
      }

      editorCol.innerHTML = stories.map((st, sIdx) => `
        <div class="story-box">
          <div class="story-head">
            <strong>الستوري #${sIdx + 1}: ${st.title || "بدون عنوان"}</strong>
            <div style="display:flex;gap:6px;">
              <button class="btn sec sm" type="button" onclick="previewStory(${sIdx})">👁 معاينة</button>
              <button class="btn sec sm" type="button" onclick="addSlide(${sIdx})">+ شريحة</button>
              <button class="btn danger sm" type="button" onclick="deleteStory(${sIdx})">حذف</button>
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label>عنوان الستوري (يظهر أسفل الدائرة)</label>
              <input type="text" value="${escapeAttr(st.title)}" oninput="updateStoryField(${sIdx}, 'title', this.value)">
            </div>
            <div>
              <label>المعرّف (ID فريد بالإنجليزية)</label>
              <input type="text" value="${escapeAttr(st.id)}" oninput="updateStoryField(${sIdx}, 'id', this.value)">
            </div>
          </div>

          <div style="margin-top:10px;">
            <label>رابط صورة الغلاف الدائرية (مثلاً <code>icon-512.png</code> أو رابط صورة)</label>
            <input type="text" value="${escapeAttr(st.cover)}" oninput="updateStoryField(${sIdx}, 'cover', this.value)">
          </div>

          <div class="slides-list">
            ${(st.slides || []).map((sl, slIdx) => `
              <div class="slide-card">
                <div class="slide-top">
                  <span>شريحة ${slIdx + 1}</span>
                  <div style="display:flex;gap:6px;">
                    <button class="btn sec sm" type="button" onclick="previewSlide(${sIdx}, ${slIdx})">عرض</button>
                    ${st.slides.length > 1 ? `<button class="btn danger sm" type="button" onclick="deleteSlide(${sIdx}, ${slIdx})">إزالة</button>` : ""}
                  </div>
                </div>

                <div class="grid-2">
                  <div>
                    <label>رابط صورة الشريحة</label>
                    <input type="text" value="${escapeAttr(sl.image)}" oninput="updateSlideField(${sIdx}, ${slIdx}, 'image', this.value)">
                  </div>
                  <div>
                    <label>ربط بمنتج (اختياري)</label>
                    <select onchange="updateSlideField(${sIdx}, ${slIdx}, 'productId', this.value)">
                      ${renderProductOptions(sl.productId)}
                    </select>
                  </div>
                </div>

                <div style="margin-top:8px;">
                  <label>النص / الوصف الظاهر أسفل الشريحة</label>
                  <textarea oninput="updateSlideField(${sIdx}, ${slIdx}, 'caption', this.value)">${escapeHtml(sl.caption)}</textarea>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    function escapeAttr(v) {
      return String(v ?? "").replace(/"/g, "&quot;");
    }
    function escapeHtml(v) {
      return String(v ?? "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.updateStoryField = (sIdx, field, val) => {
      stories[sIdx][field] = val;
      syncPreviewAndJson();
    };

    window.updateSlideField = (sIdx, slIdx, field, val) => {
      stories[sIdx].slides[slIdx][field] = val;
      syncPreviewAndJson();
    };

    window.addSlide = (sIdx) => {
      const cover = stories[sIdx].cover || "icon-512.png";
      stories[sIdx].slides.push({
        image: cover,
        caption: "شريحة جديدة",
        productId: ""
      });
      activeStoryIdx = sIdx;
      activeSlideIdx = stories[sIdx].slides.length - 1;
      renderAll();
    };

    window.deleteSlide = (sIdx, slIdx) => {
      stories[sIdx].slides.splice(slIdx, 1);
      if (activeSlideIdx >= stories[sIdx].slides.length) {
        activeSlideIdx = Math.max(0, stories[sIdx].slides.length - 1);
      }
      renderAll();
    };

    window.deleteStory = (sIdx) => {
      stories.splice(sIdx, 1);
      activeStoryIdx = 0;
      activeSlideIdx = 0;
      renderAll();
    };

    window.previewStory = (sIdx) => {
      activeStoryIdx = sIdx;
      activeSlideIdx = 0;
      syncPreviewAndJson();
    };

    window.previewSlide = (sIdx, slIdx) => {
      activeStoryIdx = sIdx;
      activeSlideIdx = slIdx;
      syncPreviewAndJson();
    };

    function syncPreviewAndJson() {
      miniBar.innerHTML = stories.map((st, idx) => `
        <div class="mini-story" onclick="previewStory(${idx})">
          <div class="mini-ring"><img src="${escapeAttr(st.cover || 'icon-512.png')}" alt=""></div>
          <span>${escapeHtml(st.title || ("ستوري " + (idx + 1)))}</span>
        </div>
      `).join("");

      const st = stories[activeStoryIdx];
      const slides = st?.slides || [];
      if (!st || !slides.length) {
        document.getElementById("prevTitle").textContent = "لا توجد شرائح";
        document.getElementById("prevCaption").textContent = "";
        document.getElementById("prevCta").style.display = "none";
        document.getElementById("slideCounter").textContent = "0 / 0";
      } else {
        if (activeSlideIdx >= slides.length) activeSlideIdx = 0;
        const sl = slides[activeSlideIdx];
        document.getElementById("prevImg").src = sl.image || st.cover || "icon-512.png";
        document.getElementById("prevTitle").textContent = st.title || "";
        document.getElementById("prevCaption").textContent = sl.caption || "";
        document.getElementById("prevCta").style.display = sl.productId ? "inline-block" : "none";
        document.getElementById("slideCounter").textContent = `${activeSlideIdx + 1} / ${slides.length}`;
      }

      const cleanStories = stories.map((stItem, i) => ({
        id: slugifyId(stItem.id || stItem.title || ("story-" + (i + 1))),
        title: String(stItem.title || "").trim(),
        cover: String(stItem.cover || "icon-512.png").trim(),
        slides: (stItem.slides || []).map(sl => ({
          image: String(sl.image || stItem.cover || "icon-512.png").trim(),
          caption: String(sl.caption || "").trim(),
          productId: String(sl.productId || "").trim()
        }))
      }));

      jsonPreview.textContent = JSON.stringify(cleanStories, null, 2);
    }

    function renderAll() {
      renderEditor();
      syncPreviewAndJson();
    }

    document.getElementById("addStoryBtn").onclick = () => {
      const n = stories.length + 1;
      stories.push({
        id: "story-" + n + "-" + Math.floor(Math.random() * 100),
        title: "ستوري جديد " + n,
        cover: "icon-512.png",
        slides: [{
          image: "icon-512.png",
          caption: "اكتب وصف العرض أو النصيحة هنا",
          productId: ""
        }]
      });
      activeStoryIdx = stories.length - 1;
      activeSlideIdx = 0;
      renderAll();
    };

    document.getElementById("loadExistingBtn").onclick = loadStories;

    document.getElementById("prevSlideBtn").onclick = () => {
      const slides = stories[activeStoryIdx]?.slides || [];
      if (!slides.length) return;
      activeSlideIdx = (activeSlideIdx - 1 + slides.length) % slides.length;
      syncPreviewAndJson();
    };

    document.getElementById("nextSlideBtn").onclick = () => {
      const slides = stories[activeStoryIdx]?.slides || [];
      if (!slides.length) return;
      activeSlideIdx = (activeSlideIdx + 1) % slides.length;
      syncPreviewAndJson();
    };

    document.getElementById("copyJsonBtn").onclick = async () => {
      try {
        await navigator.clipboard.writeText(jsonPreview.textContent);
        showToast("تم نسخ JSON إلى الحافظة ✅");
      } catch {
        showToast("تعذر النسخ التلقائي، انسخ النص من الصندوق الأسفل");
      }
    };

    document.getElementById("downloadJsonBtn").onclick = () => {
      const blob = new Blob([jsonPreview.textContent], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "stories.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("تم تحميل ملف stories.json ✅");
    };

    (async () => {
      await loadStoreProducts();
      await loadStories();
    })();
  </script>
</body>
</html>
