<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>المتجر</title>
  <link rel="icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="logo" id="shopName">المتجر</div>
    <div class="search">
      <input id="search" type="search" placeholder="ابحثي عن منتج...">
    </div>
    <button class="iconbtn" id="installAppBtn" style="display: none;">📲 تثبيت</button>
    <button class="iconbtn" id="cartBtn">
      🛒 السلة <span class="badge" id="cartCount">0</span>
    </button>
  </header>

  <nav class="cats" id="nav"></nav>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    © <span id="yr"></span> — <a href="admin.html">لوحة الإدارة</a>
  </footer>

  <div class="overlay" id="pov">
    <div class="modal" id="pmodal"></div>
  </div>
  <div class="overlay" id="cov"></div>

  <aside class="drawer" id="drawer">
    <div class="hd">
      <span>سلة التسوق</span>
      <button class="btn sec sm" id="closeCart">إغلاق</button>
    </div>
    <div class="bd" id="cartBody"></div>
    <div class="ft" id="cartFoot"></div>
  </aside>

  <script src="app.js"></script>
  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) {
        installBtn.style.display = 'inline-block';
      }
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      });
    }
  </script>
</body>
</html>
