<script>
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');
    const iosOv = document.getElementById('iosInstallOv');

    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }

    if (isIos && !isStandalone && installBtn) {
      installBtn.style.display = 'inline-block';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) {
        installBtn.style.display = 'inline-block';
      }
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      if (installBtn) installBtn.style.display = 'none';
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          installBtn.style.display = 'none';
          return;
        }
        if (isIos && iosOv) {
          iosOv.style.display = 'flex';
        }
      });
    }

    if (iosOv) {
      iosOv.addEventListener('click', (e) => {
        if (e.target.id === 'iosInstallOv') iosOv.style.display = 'none';
      });
      document.getElementById('closeIosInstall').onclick = () => iosOv.style.display = 'none';
      document.getElementById('okIosInstall').onclick = () => iosOv.style.display = 'none';
    }

    function addProductIdToStoreCart(productId, variantId = "", variantName = "") {
      if (!productId) return;

      const payload = {
        productId,
        variantId: variantId || "",
        variantName: variantName || ""
      };

      const candidateFns = [
        window.addToCart,
        window.addProductToCart,
        window.handleAddToCart
      ];
      for (const fn of candidateFns) {
        if (typeof fn === "function") {
          fn(productId, variantId || undefined, variantName || undefined);
          return;
        }
      }

      window.dispatchEvent(new CustomEvent("ldorava:addToCart", {
        detail: payload
      }));

      const countEl = document.getElementById("cartCount");
      if (countEl) {
        const current = parseInt(countEl.textContent || "0", 10) || 0;
        countEl.textContent = String(current + 1);
      }
    }

    const PROXY_CHAT_URL = "https://ldorava-ai-proxy-one.vercel.app/chat";
    const scrollTopBtn = document.getElementById("scrollTopBtn");
    const chatBtn = document.getElementById("ldorava-chat-btn");
    const chatBox = document.getElementById("ldorava-chat-box");
    const chatClose = document.getElementById("ldorava-chat-close");
    const chatForm = document.getElementById("ldorava-chat-form");
    const chatInput = document.getElementById("ldorava-chat-input");
    const chatMessages = document.getElementById("ldorava-chat-messages");
    const chatSend = document.getElementById("ldorava-chat-send");
    const storyViewerEl = document.getElementById("storyViewer");
    const gridEl = document.getElementById("grid");

    let chatHistory = [];
    let guidedStarted = false;
    let guidedState = { step: "start", category: null };
    let catalogProductsCache = [];

    const guidedFlows = {
      "الشامبو": {
        directShow: false,
        askHairType: true,
        requiredKeys: ["شامبو", "شعر", "بلسم", "ماسك", "كيراتين"],
        question: "شنو نوع شعرج أو المشكلة حتى أختار لج الشامبو والنوع المناسب؟",
        choices: [
          { label: "شعر جاف وتالف", keys: ["جاف", "جافه", "تالف", "ترطيب", "كيراتين", "ارغان", "أرغان"] },
          { label: "شعر دهني", keys: ["دهني", "دهنيه", "توازن", "منقي", "نعناع", "ليمون"] },
          { label: "تساقط وتقوية", keys: ["تساقط", "تقوية", "تقويه", "كافيين", "مقوي"] },
          { label: "ضد القشرة", keys: ["قشرة", "قشره", "فروة", "فروه"] },
          { label: "شعر مصبوغ", keys: ["مصبوغ", "مصبوغه", "ملون", "حماية اللون"] }
        ]
      },
      "العطور": {
        directShow: true,
        askHairType: false,
        requiredKeys: ["عطر", "عطور", "برفيوم", "سبلاش", "معطر", "فواح", "او دي"],
        question: "",
        choices: []
      },
      "العناية بالبشرة": {
        directShow: false,
        askHairType: false,
        requiredKeys: ["بشرة", "بشره", "غسول", "كريم", "سيروم", "مرطب", "واقي", "تونر"],
        question: "شنو أكثر شي تحتاجينه لبشرتج حالياً؟",
        choices: [
          { label: "ترطيب عميق", keys: ["ترطيب", "جافة", "جافه", "مرطب", "هيالورونيك"] },
          { label: "تفتيح ونضارة", keys: ["تفتيح", "نضارة", "نضاره", "فيتامين", "كولاجين"] },
          { label: "بشرة دهنية / حبوب", keys: ["دهنية", "دهنيه", "حبوب", "مسام", "غسول"] }
        ]
      },
      "المكياج": {
        directShow: true,
        askHairType: false,
        requiredKeys: ["مكياج", "اساس", "أساس", "روج", "حمرة", "حمره", "ماسكارا", "باودر", "كونسيلر"],
        question: "",
        choices: []
      }
    };

    const normalizeAr = s => (s || "")
      .toLowerCase()
      .replace(/[أإآ]/g, "ا")
      .replace(/ة/g, "ه")
      .replace(/ى/g, "ي")
      .trim();

    function isSummaryVariantLabel(txt) {
      const t = normalizeAr(txt);
      if (!t) return true;
      if (/^\d+\s*(انواع|نوع|خيارات|خيار)$/.test(t)) return true;
      if (/^من\s+\d/.test(t) || /د\.ع|دينار|خصم/.test(t)) return true;
      return false;
    }

    function hydrateCatalogFromStoreJson() {
      fetch("./data/store.json?v=" + Date.now())
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          const list = Array.isArray(data) ? data : (Array.isArray(data?.products) ? data.products : []);
          if (!list.length) return;
          catalogProductsCache = list.map((p, idx) => {
            const vars = Array.isArray(p.variants) ? p.variants : (Array.isArray(p.options) ? p.options : []);
            const varNames = vars
              .map(v => typeof v === "string" ? v : (v.name || v.title || v.label || ""))
              .map(s => String(s || "").trim())
              .filter(s => s && !isSummaryVariantLabel(s));
            return {
              id: String(p.id ?? idx),
              name: String(p.name || p.title || "").trim(),
              price: p.price ? `${Number(p.price).toLocaleString("en-US")} د.ع` : "",
              img: p.image || p.img || (Array.isArray(p.images) ? p.images[0] : "") || "",
              variants: varNames,
              extraText: normalizeAr(`${p.category || ""} ${p.desc || ""} ${p.description || ""} ${p.specs || ""} ${p.usage || ""} ${varNames.join(" ")}`)
            };
          });
        })
        .catch(() => {});
    }
    hydrateCatalogFromStoreJson();

    function getStoreProductsList() {
      const raw = (Array.isArray(window.PRODUCTS) && window.PRODUCTS.length)
        ? window.PRODUCTS
        : (Array.isArray(window.products) && window.products.length ? window.products : null);

      const cards = gridEl ? Array.from(gridEl.children).filter(el => !el.classList.contains("ld-empty-state")) : [];

      const domItems = cards.map((card, idx) => {
        const imgEl = card.querySelector("img");
        const heading = card.querySelector("h2, h3, h4, .title, .name, .prod-title");
        const lines = (card.innerText || "").split("\n").map(x => x.trim()).filter(Boolean);
        const name = (heading ? heading.textContent.trim() : "") || lines[0] || `منتج ${idx + 1}`;
        const price = lines.find(l => /\d/.test(l) && l !== name && !/انواع|نوع/.test(normalizeAr(l))) || "";

        const domVars = Array.from(card.querySelectorAll("[data-variant], [data-option], .variant, .var-item, .chip, option"))
          .map(el => (el.getAttribute("data-variant") || el.getAttribute("data-option") || el.textContent || "").trim())
          .filter(t => t && t.length <= 35 && !isSummaryVariantLabel(t));

        const matchedStore = catalogProductsCache.find(sp =>
          (sp.id && card.getAttribute("data-id") === sp.id) ||
          (sp.name && normalizeAr(sp.name) === normalizeAr(name))
        );

        const rawObj = raw ? (raw[idx] || raw.find(rp => normalizeAr(rp.name || rp.title || "") === normalizeAr(name))) : null;
        const rawVars = Array.isArray(rawObj?.variants) ? rawObj.variants : (Array.isArray(rawObj?.options) ? rawObj.options : []);
        const parsedRawVars = rawVars
          .map(v => typeof v === "string" ? v : (v.name || v.title || v.label || ""))
          .map(s => String(s || "").trim())
          .filter(s => s && !isSummaryVariantLabel(s));

        const finalVariants = parsedRawVars.length
          ? parsedRawVars
          : (matchedStore?.variants?.length ? matchedStore.variants : domVars);

        const extraInfo = [
          matchedStore?.extraText || "",
          rawObj?.category || "",
          rawObj?.desc || rawObj?.description || "",
          rawObj?.specs || "",
          rawObj?.usage || ""
        ].join(" ");

        return {
          id: card.getAttribute("data-id") || matchedStore?.id || String(rawObj?.id ?? idx),
          name,
          price: price || matchedStore?.price || "",
          img: imgEl ? (imgEl.getAttribute("src") || "") : (matchedStore?.img || ""),
          variants: finalVariants,
          text: normalizeAr(`${name} ${lines.join(" ")} ${finalVariants.join(" ")} ${extraInfo}`),
          cardEl: card
        };
      });

      if (domItems.length) return domItems;

      if (catalogProductsCache.length) {
        return catalogProductsCache.map(sp => ({
          id: sp.id,
          name: sp.name,
          price: sp.price,
          img: sp.img,
          variants: sp.variants,
          text: normalizeAr(`${sp.name} ${sp.extraText}`),
          cardEl: null
        }));
      }

      return [];
    }

    function appendQuickChips(labels, onSelect) {
      const wrap = document.createElement("div");
      wrap.className = "ld-ai-options";
      labels.forEach(label => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ld-ai-chip";
        btn.textContent = label;
        btn.addEventListener("click", () => {
          wrap.remove();
          onSelect(label);
        });
        wrap.appendChild(btn);
      });
      chatMessages.appendChild(wrap);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function selectVariantInsideModal(modal, variantKeyword) {
      if (!modal || !variantKeyword) return false;
      const targetKey = normalizeAr(variantKeyword);
      if (isSummaryVariantLabel(targetKey)) return false;

      const candidates = Array.from(modal.querySelectorAll(
        "button, .variant, .var-item, .opt, label, [data-variant], [data-option], [data-value]"
      ));

      const match = candidates.find(el => {
        const rawVal = (
          el.getAttribute("data-variant") ||
          el.getAttribute("data-option") ||
          el.getAttribute("data-value") ||
          el.textContent ||
          ""
        ).trim();
        const normVal = normalizeAr(rawVal);
        if (!normVal || isSummaryVariantLabel(normVal)) return false;
        if (/سلة|أضف|أضيفي|اطلب|إغلاق|×/i.test(rawVal)) return false;
        return normVal.includes(targetKey) || targetKey.includes(normVal);
      });

      if (match) {
        match.click();
        match.dispatchEvent(new Event("change", { bubbles: true }));
        return true;
      }

      const selectEl = modal.querySelector("select");
      if (selectEl) {
        const opt = Array.from(selectEl.options).find(o => {
          const nOpt = normalizeAr(o.textContent || o.value);
          return nOpt && !isSummaryVariantLabel(nOpt) && (nOpt.includes(targetKey) || targetKey.includes(nOpt));
        });
        if (opt) {
          selectEl.value = opt.value;
          selectEl.dispatchEvent(new Event("input", { bubbles: true }));
          selectEl.dispatchEvent(new Event("change", { bubbles: true }));
          return true;
        }
      }
      return false;
    }

    function openProductCard(prod, bestVariant) {
      chatBox.style.display = "none";
      syncAssistantVisibility();
      if (prod.cardEl) {
        prod.cardEl.click();
        if (bestVariant && !isSummaryVariantLabel(bestVariant)) {
          setTimeout(() => selectVariantInsideModal(document.getElementById("pmodal"), bestVariant), 150);
          setTimeout(() => selectVariantInsideModal(document.getElementById("pmodal"), bestVariant), 380);
        }
      } else {
        addProductIdToStoreCart(prod.id, "", isSummaryVariantLabel(bestVariant) ? "" : (bestVariant || ""));
      }
    }

    function pickBestVariantForTraits(prod, nTrait, nQuery) {
      const cleanVars = (prod.variants || []).filter(v => !isSummaryVariantLabel(v));
      if (!cleanVars.length) return "";

      let best = { name: "", score: 0 };
      cleanVars.forEach(vName => {
        const nv = normalizeAr(vName);
        let s = 0;
        nTrait.forEach(k => {
          if (nv.includes(k) || k.includes(nv)) s += 10;
          else if (prod.text.includes(k)) s += 2;
        });
        if (nQuery) {
          nQuery.split(/\s+/).filter(w => w.length > 1).forEach(w => {
            if (nv.includes(w) || w.includes(nv)) s += 8;
          });
        }
        if (s > best.score) {
          best = { name: vName, score: s };
        }
      });

      return best.name || cleanVars[0];
    }

    function showAssistantSelection(opts) {
      const {
        requiredKeys = [],
        traitKeys = [],
        freeQuery = "",
        autoPickSingle = false,
        emptyMessage = "ما متوفر حالياً بهذا العنوان بالمتجر."
      } = opts || {};

      const all = getStoreProductsList();
      const nReq = requiredKeys.map(normalizeAr);
      const nTrait = traitKeys.map(normalizeAr);
      const nQuery = normalizeAr(freeQuery);

      let matches = all.map(prod => {
        const reqMatched = !nReq.length || nReq.some(k => prod.text.includes(k));
        if (!reqMatched) return null;

        let score = 1;
        nTrait.forEach(k => {
          if (prod.text.includes(k)) score += 6;
        });

        if (nQuery) {
          const words = nQuery.split(/\s+/).filter(w => w.length > 1);
          const qHits = words.filter(w => prod.text.includes(w));
          if (!qHits.length) return null;
          score += qHits.length * 4;
        }

        const bestVariant = pickBestVariantForTraits(prod, nTrait, nQuery);
        if (bestVariant && nTrait.some(k => normalizeAr(bestVariant).includes(k) || k.includes(normalizeAr(bestVariant)))) {
          score += 5;
        }

        return { prod, score, bestVariant };
      }).filter(Boolean).sort((a, b) => b.score - a.score);

      if (autoPickSingle && matches.length > 1) {
        matches = [matches[0]];
      } else {
        matches = matches.slice(0, 4);
      }

      if (!matches.length) {
        appendChatMessage(emptyMessage, "bot");
      } else {
        appendChatMessage(
          autoPickSingle
            ? "هذا الشامبو الأنسب لاختيارج:"
            : "هاي المنتجات الموجودة حالياً:",
          "bot"
        );

        matches.forEach(({ prod, bestVariant }) => {
          const card = document.createElement("div");
          card.className = "ld-ai-prod-card";
          card.innerHTML = `
            ${prod.img ? `<img src="${prod.img}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:8px;flex-shrink:0;">` : ""}
            <div class="ld-ai-prod-info">
              <div class="ld-ai-prod-title">${prod.name}</div>
              ${bestVariant ? `<div class="ld-ai-prod-sub">الاختيار المناسب: ${bestVariant}</div>` : ""}
              ${prod.price ? `<div class="ld-ai-prod-price">${prod.price}</div>` : ""}
            </div>
            <button type="button" class="ld-ai-prod-btn">اختيار</button>
          `;
          card.querySelector(".ld-ai-prod-btn").addEventListener("click", () => {
            openProductCard(prod, bestVariant);
          });
          chatMessages.appendChild(card);
        });
      }

      guidedState = { step: "start", category: null };
      appendQuickChips(["سؤال جديد", "الشامبو", "العطور"], (nextChoice) => {
        if (nextChoice === "سؤال جديد") {
          startGuidedFlow();
        } else {
          handleGuidedCategory(nextChoice);
        }
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleGuidedCategory(catName) {
      const flow = guidedFlows[catName];
      if (!flow) {
        startGuidedFlow();
        return;
      }
      appendChatMessage(catName, "user");

      if (flow.directShow) {
        showAssistantSelection({
          requiredKeys: flow.requiredKeys,
          emptyMessage: `ما متوفرة حالياً منتجات في قسم "${catName}".`
        });
        return;
      }

      guidedState = { step: "sub", category: catName };
      appendChatMessage(flow.question, "bot");
      appendQuickChips(flow.choices.map(c => c.label), (subLabel) => {
        appendChatMessage(subLabel, "user");
        const picked = flow.choices.find(c => c.label === subLabel);
        showAssistantSelection({
          requiredKeys: flow.requiredKeys,
          traitKeys: picked ? picked.keys : [],
          autoPickSingle: Boolean(flow.askHairType),
          emptyMessage: "ما متوفر شامبو مطابق لهذا النوع حالياً."
        });
      });
    }

    function startGuidedFlow() {
      guidedState = { step: "cat", category: null };
      appendChatMessage("شنو تحتاجين هسه؟", "bot");
      appendQuickChips(Object.keys(guidedFlows), (cat) => handleGuidedCategory(cat));
    }

    function isHomeScreenActive() {
      const drawerOpen = document.getElementById("drawer")?.classList.contains("show");
      const povOpen = document.getElementById("pov")?.classList.contains("show");
      const covOpen = document.getElementById("cov")?.classList.contains("show");
      const shareOpen = document.getElementById("shareOv")?.classList.contains("show");
      const iosOpen = iosOv && window.getComputedStyle(iosOv).display !== "none";
      const storyOpen = storyViewerEl && window.getComputedStyle(storyViewerEl).display !== "none";
      return !(drawerOpen || povOpen || covOpen || shareOpen || iosOpen || storyOpen);
    }

    function syncScrollTopVisibility() {
      if (!scrollTopBtn) return;
      const scrollY = window.scrollY || document.documentElement.scrollTop || 0;
      const shouldShow = isHomeScreenActive() && scrollY > 240;
      scrollTopBtn.style.display = shouldShow ? "flex" : "none";
    }

    function syncAssistantVisibility() {
      const onHome = isHomeScreenActive();
      if (chatBtn && chatBox) {
        if (!onHome) {
          chatBtn.style.display = "none";
          chatBox.style.display = "none";
        } else {
          chatBtn.style.display = "inline-block";
        }
      }
      syncScrollTopVisibility();
    }

    if (scrollTopBtn) {
      scrollTopBtn.addEventListener("click", () => {
        if (!isHomeScreenActive()) return;
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      window.addEventListener("scroll", syncScrollTopVisibility, { passive: true });
    }

    if (chatBtn && chatBox) {
      chatBtn.addEventListener("click", () => {
        if (!isHomeScreenActive()) return;
        const willOpen = chatBox.style.display !== "flex";
        chatBox.style.display = willOpen ? "flex" : "none";
        if (willOpen && !guidedStarted) {
          guidedStarted = true;
          startGuidedFlow();
        }
      });
    }

    if (chatClose && chatBox) {
      chatClose.addEventListener("click", () => {
        chatBox.style.display = "none";
        syncAssistantVisibility();
      });
    }

    function appendChatMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `ld-msg ${sender}`;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    if (chatForm) {
      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;

        appendChatMessage(message, "user");
        chatInput.value = "";

        if (guidedState.step === "sub" && guidedState.category && guidedFlows[guidedState.category]) {
          const flow = guidedFlows[guidedState.category];
          showAssistantSelection({
            requiredKeys: flow.requiredKeys,
            traitKeys: [message],
            autoPickSingle: Boolean(flow.askHairType),
            emptyMessage: "ما متوفر منتج مطابق لهذا الوصف حالياً."
          });
          return;
        }

        const nMsg = normalizeAr(message);
        if (nMsg.includes("عطر") || nMsg.includes("عطور")) {
          showAssistantSelection({
            requiredKeys: guidedFlows["العطور"].requiredKeys,
            emptyMessage: "ما متوفرة عطور حالياً في المتجر."
          });
          return;
        }

        const localHits = getStoreProductsList().filter(p =>
          nMsg.split(/\s+/).filter(w => w.length > 1).some(w => p.text.includes(w))
        );
        if (localHits.length) {
          showAssistantSelection({
            freeQuery: message,
            autoPickSingle: nMsg.includes("شامبو"),
            emptyMessage: "ما متوفر منتج مطابق حالياً."
          });
          return;
        }

        chatSend.disabled = true;
        const loadingMsg = appendChatMessage("يكتب الآن...", "bot");

        try {
          const res = await fetch(PROXY_CHAT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: message,
              history: chatHistory.slice(-6)
            })
          });

          const data = await res.json();
          const replyText = data.reply || "عذراً، تعذر الحصول على رد حالياً.";
          loadingMsg.textContent = replyText;

          if (data.add_to_cart_id) {
            addProductIdToStoreCart(data.add_to_cart_id);
          }

          chatHistory.push({ role: "user", text: message });
          chatHistory.push({ role: "model", text: replyText });
        } catch (err) {
          loadingMsg.textContent = "تعذر الاتصال بالمساعد حالياً، حاول مرة أخرى.";
        } finally {
          chatSend.disabled = false;
          chatInput.focus();
        }
      });
    }

    const overlayObserver = new MutationObserver(syncAssistantVisibility);
    ["drawer", "pov", "cov", "shareOv", "iosInstallOv", "storyViewer"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) {
        overlayObserver.observe(el, { attributes: true, attributeFilter: ["class", "style"] });
      }
    });
    document.addEventListener("click", () => setTimeout(syncAssistantVisibility, 0));
    window.addEventListener("popstate", () => setTimeout(syncAssistantVisibility, 0));
    syncAssistantVisibility();

    (function initLdoravaStories() {
      const STORIES_URL = "./data/stories.json";
      const SEEN_STORAGE_KEY = "ldorava_seen_stories_v2";
      const EXPIRE_AFTER_MS = 42 * 60 * 60 * 1000;
      const SLIDE_DURATION = 5000;

      const bar = document.getElementById("storiesBar");
      const viewer = document.getElementById("storyViewer");
      const cardEl = viewer ? viewer.querySelector(".story-card") : null;
      const progressEl = document.getElementById("storyProgress");
      const titleEl = document.getElementById("storyViewerTitle");
      const miniAvatarEl = document.getElementById("storyMiniAvatar");
      const mediaEl = document.getElementById("storyMedia");
      const videoEl = document.getElementById("storyVideo");
      const captionEl = document.getElementById("storyCaption");
      const ctaBtn = document.getElementById("storyCtaBtn");

      let allStoriesRaw = [];
      let storiesData = [];
      let currentStoryIdx = 0;
      let currentSlideIdx = 0;

      let progressRaf = null;
      let progressStart = 0;
      let elapsedBeforePause = 0;
      let isPaused = false;
      let activeMode = "image";
      let holdTimer = null;
      let suppressNextTap = false;

      function stopProgressLoop() {
        if (progressRaf) {
          cancelAnimationFrame(progressRaf);
          progressRaf = null;
        }
      }

      function setSegmentWidth(slideIdx, pct) {
        const fills = progressEl ? progressEl.querySelectorAll(".story-bar-fill") : [];
        if (fills[slideIdx]) {
          fills[slideIdx].style.width = `${Math.max(0, Math.min(100, pct))}%`;
        }
      }

      function updateImageProgressFrame(now) {
        if (isPaused || activeMode !== "image") return;
        const totalElapsed = elapsedBeforePause + (now - progressStart);
        const pct = (totalElapsed / SLIDE_DURATION) * 100;
        if (pct >= 100) {
          setSegmentWidth(currentSlideIdx, 100);
          stopProgressLoop();
          nextSlide();
          return;
        }
        setSegmentWidth(currentSlideIdx, pct);
        progressRaf = requestAnimationFrame(updateImageProgressFrame);
      }

      function syncVideoProgressFrame() {
        if (activeMode !== "video" || !videoEl) return;
        const dur = videoEl.duration;
        if (Number.isFinite(dur) && dur > 0) {
          const pct = (videoEl.currentTime / dur) * 100;
          setSegmentWidth(currentSlideIdx, pct);
        }
        if (!isPaused && !videoEl.paused && !videoEl.ended) {
          progressRaf = requestAnimationFrame(syncVideoProgressFrame);
        }
      }

      function startImageTimer(fromZero = true) {
        stopProgressLoop();
        activeMode = "image";
        if (fromZero) elapsedBeforePause = 0;
        progressStart = performance.now();
        isPaused = false;
        progressRaf = requestAnimationFrame(updateImageProgressFrame);
      }

      function pauseCurrentSlide() {
        if (isPaused) return;
        isPaused = true;
        stopProgressLoop();
        if (activeMode === "image") {
          elapsedBeforePause = Math.min(SLIDE_DURATION, elapsedBeforePause + (performance.now() - progressStart));
        } else if (activeMode === "video" && videoEl && !videoEl.paused) {
          videoEl.pause();
        }
      }

      function resumeCurrentSlide() {
        if (!isPaused) return;
        isPaused = false;
        if (activeMode === "image") {
          progressStart = performance.now();
          progressRaf = requestAnimationFrame(updateImageProgressFrame);
        } else if (activeMode === "video" && videoEl && !videoEl.ended) {
          videoEl.play().catch(() => {});
          progressRaf = requestAnimationFrame(syncVideoProgressFrame);
        }
      }

      function getSeenMap() {
        try {
          const parsed = JSON.parse(localStorage.getItem(SEEN_STORAGE_KEY) || "{}");
          return (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {};
        } catch {
          return {};
        }
      }

      function saveSeenMap(map) {
        try {
          localStorage.setItem(SEEN_STORAGE_KEY, JSON.stringify(map));
        } catch {}
      }

      function isExpiredAfterView(storyId, now = Date.now()) {
        const seenMap = getSeenMap();
        const firstSeenAt = seenMap[storyId];
        if (!firstSeenAt) return false;
        return (now - Number(firstSeenAt)) >= EXPIRE_AFTER_MS;
      }

      function markSeenNow(storyId) {
        if (!storyId) return;
        const seenMap = getSeenMap();
        if (!seenMap[storyId]) {
          seenMap[storyId] = Date.now();
          saveSeenMap(seenMap);
        }
      }

      function refreshActiveStories(rerenderBar = true) {
        const now = Date.now();
        storiesData = (allStoriesRaw || []).filter(st => st && !isExpiredAfterView(st.id, now));
        if (rerenderBar) {
          renderStoriesBar();
        }
      }

      function getStoryCoverSrc(st) {
        if (st.cover && st.cover.trim() !== "") return st.cover.trim();
        const first = Array.isArray(st.slides) ? st.slides[0] : null;
        if (first) {
          if (first.poster) return first.poster;
          const m = first.media || first.image || "";
          if (m && !/\.(mp4|webm|mov)(\?.*)?$/i.test(m) && first.type !== "video") {
            return m;
          }
        }
        return "icon-512.png";
      }

      function renderStoriesBar() {
        if (!bar) return;
        if (!storiesData.length) {
          bar.style.display = "none";
          bar.innerHTML = "";
          return;
        }

        const seenMap = getSeenMap();
        bar.style.display = "flex";
        bar.innerHTML = storiesData.map((st, idx) => {
          const wasSeen = Boolean(seenMap[st.id]);
          const coverSrc = getStoryCoverSrc(st);
          return `
            <div class="story-item" data-idx="${idx}">
              <div class="story-ring ${wasSeen ? "seen" : ""}">
                <img src="${coverSrc}" alt="${st.title || ""}" loading="lazy">
              </div>
              <span class="story-title">${st.title || ""}</span>
            </div>
          `;
        }).join("");

        bar.querySelectorAll(".story-item").forEach(el => {
          el.onclick = () => openStory(parseInt(el.dataset.idx, 10));
        });
      }

      function openStory(storyIdx) {
        refreshActiveStories(false);
        if (!storiesData[storyIdx]) return;
        currentStoryIdx = storyIdx;
        currentSlideIdx = 0;
        isPaused = false;
        viewer.style.display = "flex";
        syncAssistantVisibility();
        showSlide();
      }

      function closeStory() {
        stopProgressLoop();
        clearTimeout(holdTimer);
        isPaused = false;
        if (videoEl) {
          videoEl.pause();
          videoEl.currentTime = 0;
        }
        viewer.style.display = "none";
        syncAssistantVisibility();
        refreshActiveStories(true);
      }

      function showSlide() {
        stopProgressLoop();
        clearTimeout(holdTimer);
        isPaused = false;
        elapsedBeforePause = 0;

        const story = storiesData[currentStoryIdx];
        if (!story || !Array.isArray(story.slides) || !story.slides.length) {
          return closeStory();
        }

        markSeenNow(story.id);

        const slide = story.slides[currentSlideIdx];
        titleEl.textContent = story.title || "";
        if (miniAvatarEl) {
          miniAvatarEl.src = getStoryCoverSrc(story);
        }
        captionEl.textContent = slide.caption || "";

        if (slide.productId) {
          ctaBtn.style.display = "inline-block";
          ctaBtn.textContent = slide.variantName
            ? `🛒 أضيفي للسلة (${slide.variantName})`
            : "🛒 أضيفي للسلة";
          ctaBtn.onclick = () => {
            closeStory();
            addProductIdToStoreCart(slide.productId, slide.variantId || "", slide.variantName || "");
          };
        } else {
          ctaBtn.style.display = "none";
        }

        progressEl.innerHTML = story.slides.map((_, i) => `
          <div class="story-bar-seg">
            <div class="story-bar-fill" style="width:${i < currentSlideIdx ? "100%" : "0%"}"></div>
          </div>
        `).join("");

        const mediaUrl = slide.media || slide.image || story.cover || "";
        const isVideo = slide.type === "video" || /\.(mp4|webm|mov)(\?.*)?$/i.test(mediaUrl);

        if (isVideo && videoEl) {
          activeMode = "video";
          mediaEl.style.display = "none";
          mediaEl.src = "";
          videoEl.style.display = "block";
          videoEl.src = mediaUrl;
          videoEl.currentTime = 0;

          videoEl.onloadedmetadata = () => {
            syncVideoProgressFrame();
          };
          videoEl.ontimeupdate = () => {
            syncVideoProgressFrame();
          };
          videoEl.onplay = () => {
            if (!isPaused) {
              stopProgressLoop();
              progressRaf = requestAnimationFrame(syncVideoProgressFrame);
            }
          };
          videoEl.onpause = () => {
            stopProgressLoop();
            syncVideoProgressFrame();
          };
          videoEl.onended = () => {
            setSegmentWidth(currentSlideIdx, 100);
            stopProgressLoop();
            nextSlide();
          };

          videoEl.play().catch(() => {});
        } else {
          if (videoEl) {
            videoEl.pause();
            videoEl.style.display = "none";
            videoEl.src = "";
            videoEl.onended = null;
            videoEl.ontimeupdate = null;
            videoEl.onloadedmetadata = null;
            videoEl.onplay = null;
            videoEl.onpause = null;
          }
          mediaEl.style.display = "block";
          mediaEl.src = mediaUrl;
          startImageTimer(true);
        }
      }

      function nextSlide() {
        const story = storiesData[currentStoryIdx];
        if (!story) return closeStory();
        if (currentSlideIdx + 1 < story.slides.length) {
          currentSlideIdx++;
          showSlide();
        } else if (currentStoryIdx + 1 < storiesData.length) {
          currentStoryIdx++;
          currentSlideIdx = 0;
          showSlide();
        } else {
          closeStory();
        }
      }

      function prevSlide() {
        if (currentSlideIdx > 0) {
          currentSlideIdx--;
          showSlide();
        } else if (currentStoryIdx > 0) {
          currentStoryIdx--;
          currentSlideIdx = storiesData[currentStoryIdx].slides.length - 1;
          showSlide();
        }
      }

      if (cardEl) {
        const onPressStart = (e) => {
          if (e.target.closest("button, video")) return;
          suppressNextTap = false;
          clearTimeout(holdTimer);
          holdTimer = setTimeout(() => {
            suppressNextTap = true;
            pauseCurrentSlide();
          }, 180);
        };
        const onPressEnd = () => {
          clearTimeout(holdTimer);
          if (isPaused) {
            resumeCurrentSlide();
          }
        };
        cardEl.addEventListener("pointerdown", onPressStart);
        cardEl.addEventListener("pointerup", onPressEnd);
        cardEl.addEventListener("pointercancel", onPressEnd);
        cardEl.addEventListener("pointerleave", onPressEnd);
      }

      document.getElementById("closeStoryBtn").onclick = closeStory;
      document.getElementById("storyNextZone").onclick = () => {
        if (suppressNextTap) { suppressNextTap = false; return; }
        nextSlide();
      };
      document.getElementById("storyPrevZone").onclick = () => {
        if (suppressNextTap) { suppressNextTap = false; return; }
        prevSlide();
      };

      fetch(STORIES_URL + "?v=" + Date.now())
        .then(r => r.ok ? r.json() : [])
        .then(data => {
          if (Array.isArray(data)) {
            allStoriesRaw = data;
            refreshActiveStories(true);
          }
        })
        .catch(() => {});
    })();
  </script>

إذا كانت أسماء أنواع الشامبو أو المنتجات متعددة الأنواع مكتوبة بأسماء أو مكونات أو عطور معينة داخل `data/store.json` أو `app.js`، اكتب لي أسماء الأنواع الموجودة حتى أربط كل نوع بالاختيار المناسب بدقة تامة.
