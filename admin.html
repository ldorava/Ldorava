<script>
(function ensureLoginButtonWorks() {
  const btn = document.getElementById('connect');
  const lo = document.getElementById('lo');
  const lr = document.getElementById('lr');
  const lb = document.getElementById('lb');
  const lt = document.getElementById('lt');
  if (!btn || !lo || !lr || !lb || !lt) return;

  btn.addEventListener('click', () => {
    const owner = lo.value.trim();
    const repo = lr.value.trim();
    const branch = (lb.value.trim() || 'main');
    const token = lt.value.trim();

    if (!owner || !repo || !token) {
      alert('يرجى إدخال اسم المستخدم والمستودع ومفتاح Token');
      return;
    }

    try {
      localStorage.setItem('ldorava_gh_owner', owner);
      localStorage.setItem('ldorava_gh_repo', repo);
      localStorage.setItem('ldorava_gh_branch', branch);
      localStorage.setItem('ldorava_gh_token', token);
    } catch (_) {}

    // إذا لم يقم admin.js بإخفاء شاشة الدخول خلال نصف ثانية، أظهر واجهة الإدارة مباشرة
    setTimeout(() => {
      const loginEl = document.getElementById('login');
      const appEl = document.getElementById('app');
      const logoutEl = document.getElementById('logout');
      if (loginEl && appEl && getComputedStyle(loginEl).display !== 'none') {
        loginEl.style.display = 'none';
        appEl.style.display = 'block';
        if (logoutEl) logoutEl.style.display = 'inline-block';
      }
    }, 500);
  });
})();
</script>
